name: Chinese documentation site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: notes-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the configured Pages URL
        id: pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
          cache: npm
      - name: Install locked site dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Test transformations and automatic discovery
        run: npm run test:site
      - name: Build and validate the Chinese site
        env:
          SITE_BASE_PATH: ${{ github.event_name == 'push' && format('{0}/', steps.pages.outputs.base_path) || '/Notes/' }}
          SITE_REVISION: ${{ github.sha }}
        run: |
          npm run build:site
          npm run validate:site
      - name: Install the browser used for acceptance tests
        run: npx playwright install --with-deps chromium
      - name: Test the real HTTP site
        run: npm run test:site:browser
      - name: Upload the Pages site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .site-dist
          include-hidden-files: true

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the validated artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  translation-checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out the proposed source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
          cache: npm
      - name: Install locked tooling
        run: npm ci --ignore-scripts --no-fund
      - name: Check translation structure and failure isolation without Azure
        run: |
          npm run test:translations
          npm run validate:translations
      - name: Verify localized pages against a mocked translation fixture
        run: |
          npx playwright install --with-deps chromium
          npm run test:translations:browser
