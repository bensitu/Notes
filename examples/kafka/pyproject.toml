[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "kafka-notes"
version = "1.0.0"
requires-python = ">=3.14,<3.15"
dependencies = ["confluent-kafka==2.16.1"]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.3"]

[project.scripts]
notes-kafka = "kafka_notes.demo:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kafka_notes"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
