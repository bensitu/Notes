name: Learning examples
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learning-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples/taskboard/backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B -ntp verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend
          path: examples/taskboard/backend/target/taskboard-1.0.0.jar
          if-no-files-found: error
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples/taskboard/frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: examples/taskboard/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend
          path: examples/taskboard/frontend/dist/
          if-no-files-found: error
          retention-days: 7

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples/taskboard/python
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          version: '0.13.7'
          python-version: '3.15'
      - run: uv sync --locked --all-extras
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pytest

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_PASSWORD: local-ci-only
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Build and start the API
        working-directory: examples/taskboard/backend
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -DskipTests package
          java -jar target/taskboard-1.0.0.jar > "$RUNNER_TEMP/taskboard.log" 2>&1 &
          ready=false
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
      - name: Run browser tests
        working-directory: examples/taskboard/frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e
