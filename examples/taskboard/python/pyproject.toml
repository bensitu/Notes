[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "task-tools"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "sqlalchemy==2.1.6"
]

[project.optional-dependencies]
services = [
  "pymongo==4.19.0",
  "redis==8.1.0",
  "pika==1.4.4"
]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "ruff==0.17.3"
]

[project.scripts]
task-tools = "task_tools.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/task_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
